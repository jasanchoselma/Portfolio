<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Destination host unreachable · jasancho.com</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315122A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C7A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0C0A14;--panel:#17142B;--line:#2A2544;--line-2:#3A3360;--text:#ECE9FA;--muted:#9A93BC;--dim:#6A6390;--vio:#9B8CFF;--alert:#FF5C7A;--ok:#4FE0A6}
  *{box-sizing:border-box}
  ::selection{background:var(--vio);color:var(--ink)}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);font:400 16px/1.6 "Geist",system-ui,sans-serif;padding:24px;
    background-image:radial-gradient(800px 500px at 50% -10%,rgba(255,92,122,.10),transparent 60%),linear-gradient(rgba(154,147,188,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(154,147,188,.05) 1px,transparent 1px);background-size:auto,48px 48px,48px 48px}
  main{width:min(720px,100%)}
  .code{font:700 clamp(64px,14vw,132px)/1 "Martian Mono",monospace;letter-spacing:-.06em;margin:0;color:transparent;-webkit-text-stroke:1.5px var(--alert)}
  h1{font:700 22px/1.3 "Martian Mono",monospace;margin:14px 0 10px;letter-spacing:-.02em}
  p.lead{color:var(--muted);margin:0 0 26px}
  .term{background:#08070F;border:1px solid var(--line);border-radius:12px;padding:18px 20px;font:400 12.5px/1.9 "Martian Mono",monospace;color:#C5C0E0;min-height:230px;overflow-x:auto}
  .term .p{color:var(--vio)} .term .bad{color:var(--alert)} .term .dim{color:var(--dim)}
  .term div{white-space:pre}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  a.btn{font:500 15px "Geist",sans-serif;text-decoration:none;padding:12px 18px;border-radius:7px;border:1px solid var(--line-2);color:var(--text)}
  a.btn.primary{background:var(--vio);border-color:var(--vio);color:#130F2A}
  a.btn:hover{border-color:var(--text)}
  :focus-visible{outline:2px solid #FFC56B;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Destination host unreachable</h1>
  <p class="lead">La página que buscas no existe o la he movido. He lanzado un traceroute para comprobarlo:</p>
  <div class="term" id="t" role="log" aria-live="polite"></div>
  <div class="actions">
    <a class="btn primary" href="/">Volver al inicio</a>
    <a class="btn" href="/#proyectos">Ver proyectos</a>
  </div>
</main>
<script>
  const path = (location.pathname || "/").slice(0,60);
  const out = document.getElementById("t");
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const lines = [
    `<span class="p">jasancho@soc:~$</span> traceroute jasancho.com${esc(path)}`,
    `<span class="dim">traceroute to jasancho.com (185.199.108.153), 30 hops max</span>`,
    ` 1  gateway.lan (192.168.1.1)       1.204 ms`,
    ` 2  isp-core.es (10.10.0.1)         8.931 ms`,
    ` 3  github-pages.cdn                14.112 ms`,
    ` 4  jasancho.com                    15.020 ms`,
    ` 5  ${esc(path)}  <span class="bad">!H  Destination host unreachable</span>`,
    ``,
    `<span class="p">jasancho@soc:~$</span> echo "Esta ruta no existe. Vuelve al inicio."`,
    `Esta ruta no existe. Vuelve al inicio.`
  ];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;
  (function step(){ if(i >= lines.length) return; const d = document.createElement("div"); d.innerHTML = lines[i++] || "&nbsp;"; out.appendChild(d); setTimeout(step, reduce ? 0 : (i < 3 ? 260 : 420)); })();
</script>
</body>
</html>

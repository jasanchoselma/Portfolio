<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Error del sistema · jasancho.com</title>
<style>
  :root{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;--disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(ellipse at 50% 30%,#10131A 0%,#000 70%);color:#F5F5F7;font:400 16px/1.5 var(--sans);display:grid;place-items:center;min-height:100vh;padding:28px 16px;overflow-x:hidden}
  /* suelo con rejilla, como el fondo de la web */
  body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;background:linear-gradient(transparent 0 calc(100% - 1px),rgba(41,151,255,.35) 0) 0 0/100% 48px,linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(41,151,255,.35) 0) 0 0/48px 100%;
    transform:perspective(500px) rotateX(62deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%);pointer-events:none}
  .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;width:min(720px,100%)}

  /* ---- ordenador beige de sobremesa ---- */
  .mac{position:relative;width:min(560px,100%);padding:34px 34px 0;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#E3DCC8 0%,#CFC6AE 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.12),0 50px 90px -40px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.35)}
  .bezel{position:relative;padding:18px;border-radius:14px;background:linear-gradient(180deg,#B8AF97,#C9C0A8);box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.4)}
  .screen{position:relative;aspect-ratio:4/3;border-radius:16px/20px;overflow:hidden;background:#9C9C9C;
    background-image:radial-gradient(#7E7E7E 1px,transparent 1.2px);background-size:4px 4px;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 0 0 2px #2A2824}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),radial-gradient(130% 120% at 30% 0%,rgba(255,255,255,.18),transparent 40%),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5))}
  .menubar{position:absolute;left:0;right:0;top:0;height:22px;background:#F2F2F2;border-bottom:1px solid #111;display:flex;align-items:center;gap:16px;padding:0 12px;font:700 12px var(--sans);color:#111}
  .menubar .clock{margin-left:auto;font:500 11px var(--mono)}
  /* alerta del sistema */
  .alert{position:absolute;left:50%;top:54%;width:84%;transform:translate(-50%,-50%);background:#F4F4F4;color:#111;border:2px solid #111;box-shadow:4px 4px 0 #111;padding:16px 16px 14px;display:grid;grid-template-columns:54px 1fr;gap:14px;
    animation:pop .5s cubic-bezier(.2,.9,.25,1) .5s both}
  .alert::before{content:"";position:absolute;inset:3px;border:1px solid #111;pointer-events:none}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
  .bomb{width:50px;height:50px}
  .alert h1{margin:0 0 4px;font:700 15px/1.3 var(--sans)}
  .alert p{margin:0;font:400 13px/1.45 var(--sans)}
  .alert code{font:600 12px var(--mono);background:#E2E2E2;padding:1px 4px;word-break:break-all}
  .alert .id{font:700 12px var(--mono);margin-top:8px}
  .alert .btns{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
  .alert button,.alert a{font:700 13px var(--sans);color:#111;background:#F4F4F4;border:2px solid #111;border-radius:9px;padding:5px 18px;cursor:pointer;text-decoration:none}
  .alert button{box-shadow:0 0 0 2px #F4F4F4,0 0 0 4px #111}
  .alert button:hover,.alert a:hover{background:#111;color:#F4F4F4}
  .alert button:focus-visible,.alert a:focus-visible{outline:2px dashed #2997FF;outline-offset:4px}
  /* frontal: ranura de disquete, rejilla y piloto */
  .front{position:relative;height:74px;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 6px}
  .front .badge{position:absolute;left:8px;font:700 10px var(--mono);letter-spacing:.18em;color:#8C846E;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .front .slot{width:120px;height:8px;border-radius:2px;background:#2A2824;box-shadow:inset 0 2px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.5)}
  .front .led{width:7px;height:7px;border-radius:50%;background:#3DDC84;box-shadow:0 0 8px #3DDC84;animation:blink 1.2s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .base{width:min(420px,80%);height:16px;margin-top:-1px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#BFB69E,#A99F86);box-shadow:0 18px 30px -12px rgba(0,0,0,.9)}
  .vents{position:absolute;left:160px;bottom:26px;width:90px;height:22px;background:repeating-linear-gradient(90deg,#9A9079 0 3px,transparent 3px 7px);border-radius:2px;opacity:.8}

  /* consola debajo, en fósforo verde */
  .log{width:min(560px,calc(100% - 18px));border-radius:14px;padding:14px 16px;background:#07120B;box-shadow:0 0 0 8px #1F2024,0 0 0 9px rgba(255,255,255,.06),inset 0 0 30px rgba(0,0,0,.8);
    font:400 12px/1.8 var(--mono);color:rgba(124,255,168,.75);text-shadow:0 0 6px rgba(124,255,168,.35);position:relative;overflow:hidden}
  .log::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  .log b{color:#B8FFD0} .log .err{color:#FF8DA1;text-shadow:0 0 6px rgba(255,92,122,.5)} .log .cur{display:inline-block;width:8px;height:14px;background:#7CFFA8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* reinicio: la pantalla se apaga como un tubo */
  .off .screen>*{opacity:0;transition:opacity .15s}
  .off .screen{animation:crtOff .55s cubic-bezier(.6,0,.4,1) forwards}
  @keyframes crtOff{0%{filter:brightness(1)}40%{transform:scaleY(.02);filter:brightness(3)}70%{transform:scale(.02,.02);filter:brightness(4)}100%{transform:scale(0,0);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .alert,.front .led,.log .cur{animation:none} .off .screen{animation:none;opacity:0} }
  @media (max-width:520px){ .screen{aspect-ratio:auto;min-height:330px} .alert{position:relative;left:auto;top:auto;transform:none;margin:44px auto 20px;animation:none} .mac{padding:20px 18px 0} .bezel{padding:10px} .alert{width:92%;grid-template-columns:38px 1fr;padding:12px;gap:10px} .bomb{width:36px;height:36px} .alert h1{font-size:13.5px} .alert p{font-size:12px} .menubar span:not(:first-child):not(.clock){display:none} .front .slot{width:80px} .vents{display:none} }
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <div class="mac" id="mac">
    <div class="bezel">
      <div class="screen">
        <div class="menubar" aria-hidden="true"><span>◆</span><span id="m1">Archivo</span><span id="m2">Edición</span><span id="m3">Especial</span><span class="clock" id="clock">--:--</span></div>
        <div class="alert" role="alertdialog" aria-labelledby="t" aria-describedby="d">
          <svg class="bomb" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
            <rect x="0" y="0" width="32" height="32" fill="#F4F4F4"/>
            <g fill="#111"><rect x="9" y="11" width="14" height="2"/><rect x="7" y="13" width="18" height="2"/><rect x="6" y="15" width="20" height="8"/><rect x="7" y="23" width="18" height="2"/><rect x="9" y="25" width="14" height="2"/>
              <rect x="14" y="8" width="5" height="3"/><rect x="18" y="5" width="2" height="3"/><rect x="20" y="3" width="2" height="2"/></g>
            <rect x="10" y="16" width="3" height="3" fill="#F4F4F4"/>
            <g fill="#FFB547"><rect x="23" y="1" width="2" height="2"/><rect x="25" y="3" width="2" height="2"/><rect x="22" y="0" width="1" height="1"/></g>
          </svg>
          <div>
            <h1 id="t">Lo sentimos, se ha producido un error del sistema.</h1>
            <p id="d">No existe ninguna página en <code id="path">/</code>. Puede que el enlace esté mal escrito o que la página se haya movido.</p>
            <p class="id" id="eid">ID = 404</p>
          </div>
          <div class="btns">
            <a href="/#proyectos" id="b2">Ver proyectos</a>
            <button type="button" id="restart" autofocus>Reiniciar</button>
          </div>
        </div>
      </div>
    </div>
    <div class="front" aria-hidden="true"><span class="badge">JASANCHO · SOC</span><span class="vents"></span><span class="slot"></span><i class="led"></i></div>
  </div>
  <div class="base" aria-hidden="true"></div>
  <div class="log" aria-hidden="true" id="log"></div>
</main>
<script>
(function(){
  var en = !/^es|^ca|^gl|^eu/i.test(navigator.language || "es");
  var path = location.pathname + location.search;
  var $ = function(id){ return document.getElementById(id); };
  $("path").textContent = path;
  if(en){
    document.documentElement.lang = "en"; document.title = "System error · jasancho.com";
    $("t").textContent = "Sorry, a system error occurred.";
    $("d").innerHTML = "There is no page at <code></code>. The link may be mistyped or the page may have moved.";
    $("d").querySelector("code").textContent = path;
    $("restart").textContent = "Restart"; $("b2").textContent = "See projects";
    $("m1").textContent = "File"; $("m2").textContent = "Edit"; $("m3").textContent = "Special";
  }
  var tick = function(){ var d = new Date(); $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  tick(); setInterval(tick, 10000);
  // registro de consola: la petición que ha fallado
  var ts = function(){ return new Date().toTimeString().slice(0, 8); };
  var lines = [
    ["", "<b>$</b> curl -I https://jasancho.com" + path.replace(/</g, "&lt;")],
    ["", "&lt; HTTP/2 404"],
    ["", "&lt; server: GitHub.com"],
    ["err", ts() + " pages[" + (en ? "router" : "router") + "]: " + (en ? "no route for " : "sin ruta para ") + path.replace(/</g, "&lt;")],
    ["", "<b>$</b> " + (en ? "sudo reboot" : "sudo reboot") + " <span class=\"cur\"></span>"]
  ];
  var log = $("log"), k = 0;
  (function add(){ if(k >= lines.length) return; var d = document.createElement("div"); d.className = lines[k][0]; d.innerHTML = lines[k][1]; log.appendChild(d); k++; setTimeout(add, 260); })();
  // reiniciar: la pantalla se apaga y vuelve a la portada
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("restart").addEventListener("click", function(){
    $("mac").classList.add("off");
    setTimeout(function(){ location.href = "/"; }, reduce ? 0 : 650);
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Enter" && document.activeElement === document.body) $("restart").click(); });
})();
</script>
</body>
</html>
